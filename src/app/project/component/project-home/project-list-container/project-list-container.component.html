<cas-topbar
  title="Caster"
  [topbarView]="TopbarView.CASTER_HOME"
  [sidenav]="null"
/>

<div class="content-container">
  @if (managesGroups$ | async) {
    <button
      matButton
      type="button"
      class="project-groups"
      (click)="openProjectGroups()"
    >
      <mat-icon fontIcon="mdi-folder-multiple-outline" />
      Project Groups
    </button>
  }
  <cas-project-list
    [projects]="projects | async"
    [isLoading]="isLoading$ | async"
  />
</div>
