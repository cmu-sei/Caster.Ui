<div class="header d-flex flex-row gap-3">
  <button
    mat-raised-button
    color="primary"
    (click)="showModuleList = !showModuleList"
    [disabled]="!canEdit()"
  >
    @if (!(showModuleList$ | async)) {
      Add Module
    } @else {
      Close
    }
  </button>
</div>

@if (showModuleList$ | async) {
  <cas-module-list
    [modules]="modules$ | async"
    [isEditing]="true"
    (getModule)="getModuleFn($event.id)"
  ></cas-module-list>
}

<ng-template #addDialog>
  <cas-module-variables
    [selectedModule]="newModule"
    [name]="newModuleName"
    [readOnly]="!canEdit()"
    [variables]="variables$ | async"
    [outputs]="outputs$ | async"
    [isSaving]="saving$ | async"
    [requireChanges]="false"
    [requireValues]="true"
    submitButtonText="Add"
    (variablesSelected)="onAddComplete($event)"
  ></cas-module-variables>
</ng-template>

@if (!showModuleList) {
  <div class="d-flex flex-row flex-wrap gap-3">
    @for (
      designModule of designModules$ | async;
      track trackByFn($index, designModule)
    ) {
      <div class="module">
        <cas-design-module
          [designModule]="designModule"
          [module]="moduleQuery.selectByModuleId(designModule.moduleId) | async"
          [canEdit]="canEdit()"
        ></cas-design-module>
      </div>
    }
  </div>
}
