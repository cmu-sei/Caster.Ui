<crucible-dialog
  dialogTitle="Sync a GitLab Project"
  [form]="form"
  submitLabel="Sync"
  [submitDisabled]="!form.valid || !form.dirty"
  (submit)="onSubmit()"
>
  <div crucibleDialogContent [formGroup]="form">
    <mat-form-field class="form-full-width">
      <mat-label>GitLab Project ID</mat-label>
      <input
        formControlName="projectId"
        matInput
        autocomplete="off"
        inputmode="numeric"
        cdkFocusInitial
      />
      @if (projectId.invalid && (projectId.dirty || projectId.touched)) {
        <mat-error>
          @if (projectId.hasError('required')) {
            GitLab Project ID is required.
          } @else {
            GitLab Project ID must be a number.
          }
        </mat-error>
      }
    </mat-form-field>
  </div>
</crucible-dialog>
