<crucible-dialog
  dialogTitle="Add Module"
  [form]="form"
  submitLabel="Add"
  [submitDisabled]="!form.valid || !form.dirty"
  (submit)="onSubmit()"
>
  <div crucibleDialogContent [formGroup]="form">
    <mat-form-field class="form-full-width">
      <mat-label>External Module ID</mat-label>
      <input
        formControlName="externalModuleId"
        matInput
        autocomplete="off"
        cdkFocusInitial
      />
      <mat-hint
        >A module source name, or name/subdirectory for one module in it. For
        a GitLab source, its project ID.</mat-hint
      >
      @if (
        externalModuleId.invalid &&
        (externalModuleId.dirty || externalModuleId.touched)
      ) {
        <mat-error>External Module ID is required.</mat-error>
      }
    </mat-form-field>
  </div>
</crucible-dialog>
