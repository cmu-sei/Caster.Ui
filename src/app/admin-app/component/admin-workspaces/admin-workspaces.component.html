@if ((lockingEnabled$ | async) === false) {
  <div class="operations-disabled" role="status">
    <mat-icon class="mdi-24px" fontIcon="mdi-alert" />
    Workspace operations are disabled. Caster refuses to plan, apply, destroy
    or reject runs, change resources or delete Workspaces until they are
    enabled again or the Caster API restarts.
  </div>
}

<cas-active-runs
  [runs]="activeRuns$ | async"
  [expandedRuns]="expandedRuns$ | async"
  [workspaces]="workspaces()"
  [loading]="loading()"
  (expandRun)="expandRun($event)"
  (planUpdated)="planOutput($event)"
  (applyUpdated)="applyOutput($event)"
>
  <cas-locking-status
    [lockingEnabled]="lockingEnabled$ | async"
    [canManage]="canManage$ | async"
    [busy]="changingLocking()"
    (setLockingEnabled)="setLockingEnabled($event)"
  />
</cas-active-runs>
