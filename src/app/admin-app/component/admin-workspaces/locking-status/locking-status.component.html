<!-- The wrapper shows the tooltip when the toggle is disabled. -->
<span class="locking" [matTooltip]="tooltip()" matTooltipClass="wide-tooltip">
  <mat-slide-toggle
    [checked]="lockingEnabled() === false"
    [disabled]="!canManage() || busy() || lockingEnabled() == null"
    (click)="toggleLocking($event)"
  >
    Disable Workspace Operations
  </mat-slide-toggle>
</span>
