<crucible-dialog
  [dialogTitle]="title"
  [form]="form"
  submitLabel="Assign"
  loadingLabel="Assigning"
  [loading]="saving()"
  [errorMessage]="error()"
  [submitDisabled]="!form.valid || saving()"
  (submit)="save()"
>
  <div crucibleDialogContent [formGroup]="form">
    <mat-form-field class="form-full-width">
      <mat-label>Project</mat-label>
      <mat-select formControlName="projectId" cdkFocusInitial>
        @for (project of projects() ?? []; track project.id) {
          <mat-option [value]="project.id">{{ project.name }}</mat-option>
        }
      </mat-select>
      @if (projects()?.length === 0) {
        <mat-hint>Every project you can see already has this set.</mat-hint>
      } @else {
        <mat-hint>
          Every workspace in the project gets this set's variables on its next
          run.
        </mat-hint>
      }
    </mat-form-field>
  </div>
</crucible-dialog>
