<div class="cssLayoutRowStartCenter">
  <div class="sp-icon">
    <mat-icon class="mdi-24px" fontIcon="mdi-lan" />
  </div>
  <mat-form-field class="search-field">
    <input
      matInput
      [ngModel]="filterString()"
      (ngModelChange)="filterString.set($event)"
      placeholder="Search"
      autocomplete="off"
    />
    @if (filterString()) {
      <button
        matSuffix
        mat-icon-button
        aria-label="Clear"
        (click)="clearFilter()"
      >
        <mat-icon class="mdi-24px" fontIcon="mdi-close-circle-outline" />
      </button>
    }
  </mat-form-field>
  <button
    mat-icon-button
    color="primary"
    aria-label="Add New Pool"
    matTooltip="Add New Pool"
    (click)="createPool()"
    [disabled]="!canEdit()"
  >
    <mat-icon class="mdi-24px" fontIcon="mdi-plus-circle" />
  </button>
  <button
    mat-icon-button
    color="primary"
    aria-label="About pools"
    [matTooltip]="aboutPools"
    matTooltipShowDelay="0"
  >
    <mat-icon class="mdi-24px" fontIcon="mdi-information" />
  </button>
</div>

@if (isLoading()) {
  <mat-card
    appearance="outlined"
    style="display: flex; justify-content: center; align-items: center"
  >
    <mat-progress-spinner color="primary" mode="indeterminate" />
  </mat-card>
} @else {
  <div class="container">
    @for (pool of filteredPools(); track pool.id) {
      <cas-pool-list-item
        [pool]="pool"
        [canEdit]="canEdit()"
        (poolSelected)="selectPool(pool)"
      />
    } @empty {
      <p class="empty">
        @if (filterString()) {
          No data matching the filter "{{ filterString() }}"
        } @else {
          There are currently no Pools
        }
      </p>
    }
  </div>
}
