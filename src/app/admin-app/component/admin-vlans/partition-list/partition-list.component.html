<div class="cssLayoutRowStartCenter header">
  <ng-content />
  <button
    mat-icon-button
    color="primary"
    aria-label="Add New Partition"
    matTooltip="Add New Partition"
    (click)="createPartition()"
    [disabled]="!canEdit()"
  >
    <mat-icon class="mdi-24px" fontIcon="mdi-plus-circle" />
  </button>
</div>
<mat-accordion class="accordion" multi>
  <cas-partition [poolId]="poolId" [canEdit]="canEdit()" />

  @for (partition of partitions$ | async; track partition) {
    <cas-partition [partition]="partition" [canEdit]="canEdit()" />
  }
</mat-accordion>
