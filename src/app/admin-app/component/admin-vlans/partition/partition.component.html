<mat-expansion-panel>
  <mat-expansion-panel-header>
    <mat-panel-title class="title">
      @if (partition) {
        <button
          mat-icon-button
          [attr.aria-label]="partition?.isDefault ? 'Unset Default' : 'Set Default'"
          [matTooltip]="partition?.isDefault ? 'Unset Default' : 'Set Default'"
          (click)="
            partition?.isDefault
              ? unsetDefault($event, partition.id)
              : setDefault($event, partition.id)
          "
          >
          @if (partition?.isDefault) {
            <mat-icon
              class="mdi-24px"
              fontIcon="mdi-check-circle"
              color="primary"
              >
            </mat-icon>
          }
          @if (!partition?.isDefault) {
            <mat-icon
              class="mdi-24px"
              fontIcon="mdi-check-circle-outline"
              color="primary"
              >
            </mat-icon>
          }
        </button>
        <button
          mat-icon-button
          ngxClipboard
          [cbContent]="partition.id"
          (cbOnSuccess)="onClipboardSuccess()"
          (click)="$event.stopPropagation()"
          title="Copy:  {{ partition.id }}"
          [attr.aria-label]="'Copy ID of ' + partition.name"
          >
          <mat-icon class="mdi-24px" fontIcon="mdi-content-copy"></mat-icon>
        </button>
        @if (!editing) {
          <h4>{{ partition?.name }}</h4>
          @if (canEdit) {
            <button
              mat-icon-button
              color="primary"
              aria-label="Edit Name"
              matTooltip="Edit Name"
              (click)="editing = true"
              (click)="$event.stopPropagation()"
              >
              <mat-icon class="mdi-24px" fontIcon="mdi-square-edit-outline">
              </mat-icon>
            </button>
          }
        }
        @if (editing) {
          <mat-form-field (keydown.Space)="$event.stopPropagation()">
            <input
              #nameInput
              matInput
              [value]="partition?.name"
              (keydown.enter)="rename($event, $event.target)"
              (click)="$event.stopPropagation()"
              />
          </mat-form-field>
          <button
            mat-icon-button
            color="primary"
            aria-label="Rename"
            matTooltip="Rename"
            (click)="rename($event, nameInput)"
            >
            <mat-icon class="mdi-24px" fontIcon="mdi-check"> </mat-icon>
          </button>
          <button
            mat-icon-button
            color="primary"
            aria-label="Cancel"
            matTooltip="Cancel"
            (click)="editing = false"
            (click)="$event.stopPropagation()"
            >
            <mat-icon class="mdi-24px" fontIcon="mdi-cancel"> </mat-icon>
          </button>
        }
      }
      @if (!partition) {
        <h4>Unassigned</h4>
      }
    </mat-panel-title>
    <mat-panel-description class="header-description">
      @if (vlans$ | async; as vlans) {
        <div>{{ vlans.length }} VLANs</div>
      }
    </mat-panel-description>
    @if (partition && canEdit) {
      <div class="action-buttons">
        <mat-form-field
          class="vlan-amount"
          subscriptSizing="dynamic"
          matTooltip="Number of VLANs to add or remove"
          >
          <input
            #vlanAmount
            type="number"
            matInput
            [max]="4096"
            value="0"
            (click)="$event.stopPropagation()"
            />
        </mat-form-field>
        <button
          mat-icon-button
          color="primary"
          aria-label="Remove VLANs"
          matTooltip="Remove VLANs"
          (click)="removeVlans($event, vlanAmount.value)"
          >
          <mat-icon class="mdi-24px" fontIcon="mdi-minus-circle"> </mat-icon>
        </button>
        <button
          mat-icon-button
          color="primary"
          aria-label="Add VLANs"
          matTooltip="Add VLANs"
          (click)="addVlans($event, vlanAmount.value)"
          >
          <mat-icon class="mdi-24px" fontIcon="mdi-plus-circle"> </mat-icon>
        </button>
        <button
          mat-icon-button
          color="primary"
          aria-label="Delete"
          matTooltip="Delete"
          (click)="delete($event)"
          >
          <mat-icon class="mdi-24px" fontIcon="mdi-trash-can-outline"> </mat-icon>
        </button>
      </div>
    }
  </mat-expansion-panel-header>
  <ng-template matExpansionPanelContent>
    <cas-vlan-list
      [showUnassigned]="this.partition ? true : false"
      [vlans]="vlans$ | async"
      [partitions]="otherPartitions$ | async"
      [canEdit]="canEdit"
    ></cas-vlan-list>
  </ng-template>
</mat-expansion-panel>
