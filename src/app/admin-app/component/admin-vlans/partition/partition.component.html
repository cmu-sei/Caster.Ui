<mat-expansion-panel>
  <mat-expansion-panel-header>
    <mat-panel-title class="title">
      @if (partition) {
        <button
          mat-icon-button
          [attr.aria-label]="defaultTooltip"
          [matTooltip]="defaultTooltip"
          (click)="
            partition?.isDefault
              ? unsetDefault($event, partition.id)
              : setDefault($event, partition.id)
          "
        >
          @if (partition?.isDefault) {
            <mat-icon
              class="mdi-24px"
              fontIcon="mdi-check-circle"
              color="primary"
            />
          }
          @if (!partition?.isDefault) {
            <mat-icon
              class="mdi-24px"
              fontIcon="mdi-check-circle-outline"
              color="primary"
            />
          }
        </button>
        <button
          mat-icon-button
          ngxClipboard
          [cbContent]="'partition_id = &quot;' + partition.id + '&quot;'"
          (cbOnSuccess)="onClipboardSuccess()"
          (click)="$event.stopPropagation()"
          [matTooltip]="'Copy partition_id for crucible_vlan: ' + partition.id"
          [attr.aria-label]="'Copy the partition_id of ' + partition.name"
        >
          <mat-icon class="mdi-24px" fontIcon="mdi-content-copy" />
        </button>
        @if (canEdit()) {
          <!-- Clicks and keys here must not toggle the panel, even on a disabled button. -->
          <div
            class="action-buttons"
            (click)="$event.stopPropagation()"
            (keydown)="$event.stopPropagation()"
          >
            <button
              mat-icon-button
              color="primary"
              aria-label="Rename"
              matTooltip="Rename"
              (click)="rename($event)"
            >
              <mat-icon class="mdi-24px" fontIcon="mdi-square-edit-outline" />
            </button>
            <mat-form-field
              class="vlan-amount"
              subscriptSizing="dynamic"
              matTooltip="Number of VLANs to add or remove"
            >
              <input
                #vlanAmount
                type="number"
                matInput
                min="1"
                max="4096"
                step="1"
                aria-label="Number of VLANs to add or remove"
                (input)="setAmount(vlanAmount.value)"
              />
            </mat-form-field>
            <button
              mat-icon-button
              color="primary"
              aria-label="Remove VLANs"
              matTooltip="Remove VLANs"
              [disabled]="!amount()"
              (click)="removeVlans($event, vlanAmount)"
            >
              <mat-icon class="mdi-24px" fontIcon="mdi-minus-circle" />
            </button>
            <button
              mat-icon-button
              color="primary"
              aria-label="Add VLANs"
              matTooltip="Add VLANs"
              [disabled]="!amount()"
              (click)="addVlans($event, vlanAmount)"
            >
              <mat-icon class="mdi-24px" fontIcon="mdi-plus-circle" />
            </button>
            <button
              mat-icon-button
              color="primary"
              [attr.aria-label]="'Delete ' + partition.name"
              matTooltip="Delete {{ partition.name }}"
              (click)="delete($event)"
            >
              <mat-icon class="mdi-24px" fontIcon="mdi-trash-can-outline" />
            </button>
          </div>
        }
        <span class="name">{{ partition?.name }}</span>
      }
    </mat-panel-title>
    <mat-panel-description class="header-description">
      @if (vlans$ | async; as vlans) {
        <div>{{ vlans.length }} VLANs</div>
      }
    </mat-panel-description>
  </mat-expansion-panel-header>
  <ng-template matExpansionPanelContent>
    <cas-vlan-list
      [showUnassigned]="true"
      [vlans]="vlans$ | async"
      [partitions]="otherPartitions$ | async"
      [canEdit]="canEdit()"
    />
  </ng-template>
</mat-expansion-panel>
