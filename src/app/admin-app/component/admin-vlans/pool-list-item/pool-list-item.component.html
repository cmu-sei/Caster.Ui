<mat-card appearance="outlined">
  <mat-card-title class="title">
    <span>{{ pool()?.name }}</span>
    @if (pool()?.isDefault) {
      <mat-icon
        class="mdi-24px icon"
        fontIcon="mdi-check-circle"
        color="primary"
        matTooltip="Contains the Default Partition"
      />
    }
  </mat-card-title>
  <mat-card-actions class="flex">
    @if (canEdit()) {
      <button
        mat-icon-button
        color="primary"
        aria-label="Rename"
        matTooltip="Rename"
        (click)="rename()"
      >
        <mat-icon class="mdi-24px" fontIcon="mdi-square-edit-outline" />
      </button>
    }
    <button
      mat-icon-button
      color="primary"
      [attr.aria-label]="'Open ' + pool()?.name"
      matTooltip="Open {{ pool()?.name }}"
      (click)="selectPool(pool())"
    >
      <mat-icon class="mdi-24px" fontIcon="mdi-launch" />
    </button>
    @if (canEdit()) {
      <div class="align-right">
        <button
          mat-icon-button
          color="primary"
          [attr.aria-label]="'Delete ' + pool()?.name"
          matTooltip="Delete {{ pool()?.name }}"
          (click)="deletePool(pool())"
        >
          <mat-icon class="mdi-24px" fontIcon="mdi-trash-can-outline" />
        </button>
      </div>
    }
  </mat-card-actions>
</mat-card>
